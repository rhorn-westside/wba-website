name: Deploy to Azure Static Web Apps

# Two destinations, decided by which branch was pushed.
#
#   main    -> the live website that parents see
#   drafts  -> a private preview copy at its own address
#
# The office edits the `drafts` branch in Pages CMS. Nothing they save can
# reach parents until somebody runs the "Publish to the live site" workflow.

on:
  push:
    branches: [main, drafts]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          # Puts the "Preview copy — parents cannot see this" ribbon on every
          # page of the drafts build, and marks it noindex so it never turns
          # up in a search result.
          SITE_ENV: ${{ github.ref == 'refs/heads/drafts' && 'preview' || 'production' }}

      - name: Deploy
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Secret name is generated by Azure from the app hostname.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_MEADOW_02DD32510 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Eleventy has already built to _site, so skip the Oryx build.
          app_location: "_site"
          output_location: ""
          skip_app_build: true
          # The tour-request Azure Function is NOT deployed yet. Until the
          # Microsoft Graph settings exist there is nothing for it to do, and
          # leaving it out removes a way the deploy can fail. To turn it on:
          # set api_location to "api" below, add the five app settings in the
          # Azure portal, and push.
          api_location: ""
          # Anything that is not main is a preview environment, never the
          # live site. This is the line that makes the whole scheme safe.
          production_branch: main
          deployment_environment: ${{ github.ref == 'refs/heads/drafts' && 'preview' || '' }}

      - name: Keep the drafts branch level with the live site
        # After a code change lands on main, roll it into drafts so the office
        # is previewing against current templates. If drafts has unpublished
        # edits of its own this cannot fast-forward — that is fine, and the
        # Publish workflow will merge the two properly when the time comes.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git push origin HEAD:drafts \
            || echo "drafts has unpublished edits — leaving it alone."

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Preview
    steps:
      - name: Close preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_MEADOW_02DD32510 }}
          action: close
