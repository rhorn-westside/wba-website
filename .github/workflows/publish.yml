name: Publish to the live site

# The Publish button.
#
# The office edits the `drafts` branch, which builds to a private preview
# address. This workflow is what moves those edits onto the real website:
# it merges drafts into main, checks the result, and deploys.
#
# It does the deploy itself rather than letting the ordinary push-to-main
# workflow handle it. That is deliberate: a push made with GITHUB_TOKEN does
# not start another workflow, so the ordinary deploy would never fire and the
# button would appear to do nothing.
#
# Everything is built and checked BEFORE main is pushed, so a change that
# breaks a link fails here with the live site still untouched.
#
# THE DEPLOY ALWAYS RUNS. An earlier version skipped the whole job when there
# was nothing new to merge, which meant a deploy that had gone wrong could
# never be repaired by pressing the button again — and a skipped job reports
# green, so it looked like it had worked. Deploying is idempotent; skipping it
# was the only part that could do harm.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge the drafts branch into main
        run: |
          git config user.name "Publish button"
          git config user.email "actions@github.com"
          git fetch origin drafts
          if git diff --quiet HEAD origin/drafts; then
            echo "Nothing new to merge — redeploying the current live site."
          else
            git merge --no-edit origin/drafts
            echo "merged=yes" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          SITE_ENV: production

      - name: Check every internal link resolves
        run: node scripts/check-links.mjs

      - name: Check the CMS config still matches the content
        run: node scripts/check-cms-config.mjs

      - name: Check the Look & Feel colours are readable
        run: node scripts/check-contrast.mjs

      - name: Push the merge to main
        if: env.merged == 'yes'
        run: git push origin main

      - name: Deploy to the live site
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_MEADOW_02DD32510 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "_site"
          output_location: ""
          skip_app_build: true
          api_location: "api"

      - name: Confirm the tour form answered
        # The deploy reports success once the files are uploaded, which is not
        # the same as the function being reachable. This asks the live site
        # directly.
        #
        # It distinguishes two very different problems, because conflating them
        # made the run red for something a redeploy could never fix:
        #
        #   404 / 405  the function is not there at all -> the deploy is broken,
        #              fail the run.
        #   502 / 503  the function answered but cannot send -> a settings or
        #              mailbox problem outside this workflow. Warn; do not fail,
        #              because publishing site content is not what went wrong.
        run: |
          sleep 25
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{"website":"bot"}' \
            "https://lively-meadow-02dd32510.7.azurestaticapps.net/api/inquiry")
          echo "POST /api/inquiry returned $code"
          case "$code" in
            404|405)
              echo "::error::The tour form endpoint is missing ($code). The function did not deploy."
              exit 1 ;;
            502|503)
              echo "::warning::The tour form is deployed but cannot send mail ($code). Check the Graph settings in the Azure portal. Site content published normally." ;;
            200)
              echo "Tour form is answering normally." ;;
            *)
              echo "::warning::Unexpected response from the tour form ($code)." ;;
          esac

      - name: Put drafts back level with the live site
        if: env.merged == 'yes'
        run: git push origin main:drafts
