# Pages CMS configuration for the Westside Baptist Academy website.
# https://pagescms.org/docs
#
# This decides what an editor sees. Labels are written for someone who has
# never opened a source file. Fields marked "leave as it is" are structural —
# they are shown only so that saving a page does not discard them.

media:
  input: src/files
  output: /files
  categories: [document, image]

settings:
  content:
    merge: false

content:
  # -------------------------------------------------------------------
  - name: closings
    label: "School Closings"
    type: file
    path: src/_data/alert.json
    description: "The red banner across the top of every page. Use it when school is closed."
    fields:
      - name: active
        label: Show the banner
        type: boolean
        default: false
        description: Turn on to close school. Turn off to take the banner down.
      - name: title
        label: Headline
        type: string
        description: Short and plain, e.g. School is closed today.
      - name: message
        label: Message
        type: text
        description: "Two sentences at most: what is closed, which day, and when it reopens."
      - name: expires
        label: Take down automatically after — MUST be in the future
        type: date
        options:
          format: yyyy-MM-dd'T'HH:mm:ssXXX
          time: true
        required: false
        description: "Usually the morning school reopens. The banner disappears by itself once this time passes. Warning: if you set a time that has already gone by, the banner will not appear at all. Leave this empty to keep the banner up until you switch it off."
      - name: _howToUse
        label: Notes for staff
        type: string
        list: true
        required: false

  # -------------------------------------------------------------------
  - name: documents
    label: "Forms & Documents"
    type: file
    path: src/_data/forms.json
    description: "Everything on the Forms & Documents page. Upload a PDF and it appears there."
    fields:
      - name: groups
        label: Sections
        type: object
        list: true
        fields:
          - name: group
            label: Section heading
            type: string
          - name: intro
            label: Note under the heading
            type: string
            required: false
          - name: columns
            label: Show as columns
            type: boolean
            required: false
            description: Use for long lists, like the grade-by-grade book lists.
          - name: items
            label: Documents
            type: object
            list: true
            fields:
              - name: title
                label: Document name
                type: string
              - name: file
                label: PDF file
                type: file
                required: false
                options:
                  media: true
                description: Leave empty and the document shows as "Coming soon" to parents.
              - name: note
                label: Short note
                type: string
                required: false
                description: Small grey type on the right, e.g. K5 through 5th grade.

  # -------------------------------------------------------------------
  - name: staff
    label: "Faculty & Staff"
    type: file
    path: src/_data/faculty.json
    fields:
      - name: people
        label: People
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
            description: Include the title, e.g. Mrs. Jennifer Cabrera.
          - name: role
            label: Role
            type: string
          - name: group
            label: Section of the page
            type: select
            options:
              values: ["Administration", "Elementary", "Junior & Senior High", "Fine Arts"]
          - name: bio
            label: Short bio
            type: text
            required: false
            description: Two or three sentences. Optional.

  # -------------------------------------------------------------------
  - name: theme
    label: "Look & Feel"
    type: file
    path: src/_data/theme.json
    description: "Colours, fonts and sizes for the whole site. Change something, look at the preview, and publish it only if you like it."
    fields:
      - name: brandColor
        label: Brand colour
        type: string
        options:
          format: color
        description: "The school red. Used for buttons, links, the footer and the closure banner. The darker shade for hovers and the pale wash behind callouts are worked out from this automatically."
      - name: textColor
        label: Text colour
        type: string
        options:
          format: color
        description: "Nearly black reads better than pure black. Softer greys for captions are worked out from this."
      - name: pageColor
        label: Page background
        type: string
        options:
          format: color
        description: "The colour behind everything. A warm off-white is easier on the eye than pure white."
      - name: fontPairing
        label: Fonts
        type: select
        options:
          values:
            - { value: classic, label: "Classic — Palatino headings, plain body" }
            - { value: traditional, label: "Traditional — Georgia headings, Helvetica body" }
            - { value: modern, label: "Modern — Charter headings, plain body" }
            - { value: plain, label: "Plain — no serif anywhere" }
        description: "These all use fonts already on people's computers, so nothing has to load and the page never flashes as it changes."
      - name: headingFont
        label: Headings
        type: select
        options:
          values:
            - { value: serif, label: "Serif — the traditional look" }
            - { value: sans, label: "Plain — a more modern look" }
      - name: textSize
        label: Text size
        type: select
        options:
          values:
            - { value: small, label: Small }
            - { value: normal, label: Normal }
            - { value: large, label: Large }
            - { value: larger, label: "Extra large" }
        description: "Everything scales together. Worth nudging up if parents tell you the site is hard to read."
      - name: corners
        label: Corners
        type: select
        options:
          values:
            - { value: square, label: "Square" }
            - { value: slight, label: "Slightly rounded" }
            - { value: rounded, label: "Rounded" }
        description: On buttons, cards and photos.
      - name: contentWidth
        label: Content width
        type: select
        options:
          values:
            - { value: narrow, label: "Narrow" }
            - { value: standard, label: "Standard" }
            - { value: wide, label: "Wide" }
        description: How far text stretches across a large screen.

  # -------------------------------------------------------------------
  - name: settings
    label: "School Information"
    type: file
    path: src/_data/site.json
    description: Changing anything here updates every page at once.
    fields:
      - name: contact
        label: School contact
        type: object
        fields:
          - { name: street, label: Street, type: string }
          - { name: city, label: City, type: string }
          - { name: state, label: State, type: string }
          - { name: zip, label: ZIP, type: string }
          - { name: phone, label: Phone (as displayed), type: string }
          - name: phoneHref
            label: Phone (for tapping on a mobile)
            type: string
            description: Digits only with country code, e.g. +12814923448
          - { name: email, label: Email, type: string }
          - { name: officeHours, label: Office hours, type: string }
      - name: schoolDay
        label: School day
        type: object
        fields:
          - { name: start, label: School begins, type: string }
          - { name: elementaryEnd, label: Elementary dismissal, type: string }
          - { name: secondaryEnd, label: Secondary dismissal, type: string }
      - name: church
        label: Church
        type: object
        fields:
          - { name: name, label: Church name, type: string }
          - { name: url, label: Church website, type: string }
          - { name: pastor, label: Pastor, type: string }
          - name: services
            label: Service times
            type: object
            list: true
            fields:
              - { name: name, label: Service, type: string }
              - { name: time, label: Time, type: string }
      - name: purpose
        label: Purpose statement
        type: text
        description: Used on the homepage and in search results.
      - { name: tagline, label: Tagline, type: string }
      - { name: name, label: School name (leave as it is), type: string }
      - { name: shortName, label: Short name (leave as it is), type: string }
      - { name: founded, label: Year founded (leave as it is), type: number }
      - { name: grades, label: Grades served (leave as it is), type: string }
      - { name: mascot, label: Mascot (leave as it is), type: string }
      - { name: logo, label: Header logo file (leave as it is), type: string }
      - { name: logoLarge, label: Large logo file (leave as it is), type: string }
      - name: homeworkUrl
        label: Homework schedule address
        type: string
        description: "Where the Homework Schedule buttons point. Change it here and every link on the site follows."
      - { name: url, label: Website address (leave as it is), type: string }

  # -------------------------------------------------------------------
  - name: homepage
    label: "Homepage"
    type: file
    path: src/_data/home.json
    description: "Everything on the front page. The school day table and the purpose sentence come from School Information."
    fields:
      - name: hero
        label: "Top of the page"
        type: object
        fields:
          - { name: eyebrow, label: Small line above the heading, type: string }
          - { name: heading, label: Main heading, type: string }
          - name: primaryButton
            label: Red button
            type: object
            fields:
              - { name: label, label: Button wording, type: string }
              - { name: url, label: Web address, type: string }
          - name: secondaryButton
            label: White button
            type: object
            fields:
              - { name: label, label: Button wording, type: string }
              - { name: url, label: Web address, type: string }
      - name: proof
        label: "Four facts strip"
        type: object
        list: true
        fields:
          - { name: figure, label: Large red text, type: string }
          - { name: label, label: Small caption, type: string }
      - name: anniversary
        label: "Anniversary band"
        type: object
        fields:
          - { name: show, label: Show this section, type: boolean, description: "Turn off after the anniversary year ends." }
          - { name: eyebrow, label: Small line above the heading, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: body, label: Text, type: rich-text }
      - name: doors
        label: "Three panels"
        type: object
        list: true
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: text, label: Text, type: text }
          - { name: linkText, label: Link wording, type: string }
          - { name: url, label: Web address, type: string }
      - name: why
        label: "Why Westside section"
        type: object
        fields:
          - { name: eyebrow, label: Small line above the heading, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: lede, label: Opening paragraph, type: text }
          - { name: buttonLabel, label: Button wording, type: string }
          - { name: buttonUrl, label: Button web address, type: string }
          - name: marks
            label: Points
            type: object
            list: true
            fields:
              - { name: heading, label: Point, type: string }
              - { name: text, label: Explanation, type: text }
      - name: goals
        label: "Program goals section"
