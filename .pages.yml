  # -------------------------------------------------------------------
  - name: applypage
    label: "How to Apply Page"
    type: file
    path: src/_data/apply.json
    description: "The enrollment steps. Write %PHONE% or %EMAIL% anywhere and the school's real number or address is inserted automatically."
    fields:
