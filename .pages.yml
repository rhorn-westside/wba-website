        label: "Numbered steps"
        type: object
        list: true
        fields:
          - { name: heading, label: Step heading, type: string }
          - { name: text, label: Step text, type: rich-text }
      - name: sections
        label: "Sections below the steps"
        type: object
        list: true
        fields:
          - { name: heading, label: Section heading, type: string }
          - { name: body, label: Section text, type: rich-text }

  # -------------------------------------------------------------------
  - name: contactpage
    label: "Contact Page"
    type: file
    path: src/_data/contact.json
    description: "Wording on the Contact page. Phone, address, hours and service times live under School Information."
    fields:
      - name: lede
        label: Intro line under the heading
        type: string
      - name: whoToAsk
        label: "Who to ask"
        type: object
        list: true
        fields:
          - name: topic
            label: What it's about
            type: string
          - name: who
            label: Who to contact
            type: string
      - name: employment
        label: Employment
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: text
            label: Text
            type: text
            description: The school's email address is added automatically at the end.
      - name: visiting
        label: "Visiting campus card"
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: text
            label: Text
            type: text
      - name: servicesNote
        label: Note under the service times
        type: string
      - name: extraService
        label: Extra service time
        type: object
        description: An additional service shown after the ones in School Information. Clear the name to hide the row.
        fields:
          - name: name
            label: Service
            type: string
            required: false
          - name: time
            label: Time
            type: string
            required: false

  # -------------------------------------------------------------------
  - name: newpages
    label: "New Pages"
    type: collection
    path: src/pages
    filename: "{primary}.md"
    view:
      fields: [title, lede]
    description: "Pages you create yourself. After making one, add it to the Navigation Menu so people can find it."
    fields:
      - name: title
        label: Page title
        type: string
      - name: lede
        label: Intro line under the title
        type: text
        required: false
        description: One sentence, shown in larger grey type at the top of the page.
      - name: body
        label: Page content
        type: rich-text

  # -------------------------------------------------------------------
  - name: navigation
    label: "Navigation Menu"
    type: file
    path: src/_data/nav.json
    description: "The menu across the top of every page. Drag to reorder."
    fields:
      - name: items
        label: Menu items
        type: object
        list: true
        fields:
          - name: title
            label: Menu wording
            type: string
          - name: url
            label: Web address it points to
            type: string
            description: "Start and end with a slash, e.g. /pages/summer-camp/ — a page you created lives under /pages/ followed by its name in lowercase with hyphens."
          - name: children
            label: Drop-down items
            type: object
            list: true
            required: false
            fields:
              - name: title
                label: Menu wording
                type: string
              - name: url
                label: Web address it points to
                type: string

